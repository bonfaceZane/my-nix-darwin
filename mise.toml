

[tasks.aider]
description = "Run Aider with BYOK (DeepSeek); pass target files after --"
run = "aider --model deepseek/deepseek-reasoner --no-auto-commits --no-check-update"

[tasks.opencode]
description = "Launch OpenCode with the global skills + LSP config"
run = "opencode"

[tasks.oc-setup]
description = "Wire OpenCode globally and write a local config for the given directories"
run = "./dotfiles/setup.sh all ."

[tasks.switch]
description = "Build and activate the system configuration (requires sudo)"
run = "sudo -E darwin-rebuild switch --flake .#rafiki --show-trace --impure"

[tasks.build]
description = "Build without activating the system"
run = "darwin-rebuild build --flake .#rafiki --show-trace --impure"
alias = "b"

[tasks.mcp-render]
description = "Re-render every client MCP config from dotfiles/ai/mcp/servers.json"
run = "python3 dotfiles/ai/mcp/render.py --write"

[tasks.mcp-check]
description = "Check MCP configs against the root config without writing"
run = "python3 dotfiles/ai/mcp/render.py --check"

[tasks.validate]
description = "Validate repository AI config and dotfile wiring without activation"
run = "python3 scripts/validate-config.py"

[tasks.validate-ai]
description = "Validate only the shared AI configuration sources"
run = "python3 dotfiles/ai/validate.py"

[tasks.rebuild]
description = "Alias for build (no activation)"
run = "mise run build"
alias = "r"

[tasks.darwin]
description = "Alias for build (no activation)"
run = "mise run build"

[tasks.update]
description = "Update flake inputs and build without activation"
run = """
nix flake update
mise run build
"""
alias = "u"

[tasks.clean]
description = "Clean up old generations (system profile)"
run = "sudo nix profile wipe-history --profile /nix/var/nix/profiles/system --older-than 7d"
alias = "c"

[tasks.gc]
description = "Nix garbage collection"
run = "nix-collect-garbage -d"
alias = "gc"

[tasks.rollback]
description = "Rollback to previous generation"
run = "sudo darwin-rebuild switch --rollback"
alias = "rb"

[tasks.show]
description = "Show flake outputs"
run = "nix flake show"
alias = "s"

[tasks.check]
description = "Check flake"
run = "nix flake check"
alias = "ch"
