# Apple Silicon Homebrew seed for a missing CODEX_HOME/config.toml, not a live config layer.
# Never overwrite an existing config, symlink, or user-selected model/integration.
# Shared instructions belong in CODEX_HOME/AGENTS.md.
# Auto-approve safe operations; escalate only for security-essential actions.
# Destructive commands (rm, sudo, chmod, chown, force-push, reset --hard) and
# secret access (secrets.yaml, .env*, .sops.yaml, ~/.ssh, ~/.aws) still prompt.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

# Optional mobile/web UI testing; prerequisites are declared in Nix-managed Homebrew.
# Native file, shell, Git, and Nix tools are sufficient for this repository.
#
# The npm-backed servers (mobile-mcp, ios-simulator, context7) and the remote Expo
# server are registered in the mutable CODEX_HOME/config.toml instead, because this
# seed disables sandbox network access. If you add the Expo server there, keep its
# guard: `default_tools_approval_mode = "prompt"` so nothing runs unattended, plus a
# `disabled_tools` list refusing add_library, workflow_create/run/cancel,
# build_run/cancel/submit, the store reply/delete tools, and automation_tap,
# automation_take_screenshot, collect_app_logs. dotfiles/ai/validate.py holds the
# full list and the per-client policy.
[mcp_servers.maestro]
command = "/opt/homebrew/bin/maestro"
args = ["mcp"]

[mcp_servers.maestro.env]
JAVA_HOME = "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home"
